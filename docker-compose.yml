services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geopulse-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - geopulse-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geopulse-backend
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    expose:
      - "8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geopulse-net

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: geopulse-ingest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - geopulse-net

  simulator:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    container_name: geopulse-simulator
    command: ["./simulator", "-url", "http://ingest:8080/ingest/telemetry", "-interval", "4s"]
    depends_on:
      - ingest
    restart: unless-stopped
    networks:
      - geopulse-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geopulse-frontend
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - "5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks:
      - geopulse-net

  nginx:
    image: nginx:alpine
    container_name: geopulse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ingest
      - frontend
    networks:
      - geopulse-net

volumes:
  postgres_data:

networks:
  geopulse-net:
    driver: bridge
